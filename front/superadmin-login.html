<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Super administration | ALBA-STOCK</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#183b35}.admin-card{width:min(420px,calc(100% - 32px));background:#fff;border-radius:12px;padding:32px;color:#1d2926}.admin-card h1{font:600 24px 'Space Grotesk';margin:0}.admin-card p{color:#73807b;font-size:13px}.admin-mark{display:flex;gap:10px;align-items:center;font:700 23px 'Space Grotesk';margin-bottom:28px}.admin-mark span{display:grid;place-items:center;width:34px;height:34px;background:#f07f5f;color:#fff;border-radius:9px}.admin-field{display:block;margin:17px 0;color:#73807b;font-size:12px;font-weight:700}.admin-field input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #e6ebe7;border-radius:6px}.admin-submit{width:100%;padding:12px;background:#183b35;color:#fff;border:0;border-radius:7px;font-weight:700}.admin-error{display:none;background:#fde8e4;color:#bb5149;padding:10px;border-radius:6px;font-size:12px}.admin-error.visible{display:block}</style></head><body><main class="admin-card"><div class="admin-mark"><span>A</span>ALBA-STOCK</div><h1>Super administration</h1><p>Gérez l’activation et la désactivation des entreprises.</p><div class="admin-error" id="admin-error"></div><form id="admin-login-form"><label class="admin-field">Email<input type="email" name="email" value="admin@gmail.com" required></label><label class="admin-field">Mot de passe<input type="password" name="password" required></label><button class="admin-submit">Accéder à l’administration</button></form></main><script src="superadmin-login.js"></script></body></html>
