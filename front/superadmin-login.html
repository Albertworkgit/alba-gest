<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super administration | ALBA-STOCK</title>
  <link rel="stylesheet" href="styles.css?v=20261011-ui-polish-5">
</head>
<body class="auth-page">
  <main class="auth-simple-layout auth-simple-admin">
    <header class="auth-simple-header">
      <a class="auth-simple-brand" href="login.html" aria-label="ALBA-STOCK"><span class="auth-brand-mark">A</span><span>ALBA-STOCK<span class="brand-dot">.</span></span></a>
      <div class="auth-simple-heading"><h1>Administration</h1><p>Connectez-vous à votre espace sécurisé.</p></div>
    </header>
    <section class="auth-simple-card" aria-label="Connexion à l’administration">
      <div class="admin-error" id="admin-error" role="alert"></div>
      <form id="admin-login-form">
        <label class="admin-field">Email<span class="auth-input-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></span><input type="email" name="email" autocomplete="username" placeholder="Votre adresse email" required></label>
        <label class="admin-field">Mot de passe<span class="auth-input-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg></span><input type="password" name="password" autocomplete="current-password" placeholder="Votre mot de passe" required></label>
        <button class="admin-submit">Se connecter <span aria-hidden="true">→</span></button>
      </form>
    </section>
    <p class="auth-simple-footer"><a href="login.html">Retour à la connexion</a></p>
  </main>
  <script src="password-toggle.js?v=20261011-ui-polish-4"></script>
  <script src="superadmin-login.js"></script>
</body>
</html>
