<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer une entreprise | ALBA-STOCK</title>
  <link rel="stylesheet" href="styles.css">
  <style>body{min-height:100vh;display:grid;place-items:center;background:#f5f7f3}.register-card{width:min(620px,calc(100% - 32px));background:#fff;border:1px solid #e6ebe7;border-radius:12px;padding:30px;box-shadow:0 20px 50px #183b3514}.register-brand{font:700 23px 'Space Grotesk',sans-serif;color:#1d2926;margin-bottom:26px}.register-brand span{display:inline-grid;place-items:center;width:32px;height:32px;background:#f07f5f;color:#fff;border-radius:8px;margin-right:8px}.register-card h1{font:600 24px 'Space Grotesk',sans-serif;margin:0}.register-card>p{color:#73807b;font-size:13px}.register-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.register-field{display:block;color:#73807b;font-size:11px;font-weight:700}.register-field input{width:100%;margin-top:6px;padding:11px;border:1px solid #e6ebe7;border-radius:6px;font:inherit}.register-field.full{grid-column:1/-1}.register-submit{width:100%;background:#147c70;color:#fff;padding:12px;border:0;border-radius:7px;font-weight:700;margin-top:20px}.register-message{display:none;padding:11px;border-radius:6px;font-size:12px;margin-top:15px}.register-message.visible{display:block}.register-message.success{background:#e2f2eb;color:#247662}.register-message.error{background:#fde8e4;color:#bb5149}@media(max-width:580px){.register-grid{grid-template-columns:1fr}.register-field.full{grid-column:auto}}</style>
</head>
<body>
  <main class="register-card">
    <div class="register-brand"><span>A</span>ALBA-STOCK</div>
    <h1>Créer votre entreprise</h1>
    <p>Votre demande sera examinée et activée par le super administrateur.</p>
    <div class="register-message" id="register-message"></div>
    <form id="register-form"><div class="register-grid">
      <label class="register-field full">Nom de l'entreprise<input name="enterprise_name" required></label>
      <label class="register-field">Téléphone de l'entreprise<input name="phone" type="tel"></label>
      <label class="register-field">Adresse de l'entreprise<input name="address"></label>
      <label class="register-field">Nom complet<input name="full_name" required></label>
      <label class="register-field">Nom utilisateur<input name="username" required></label>
      <label class="register-field">Email<input name="email" type="email" required></label>
      <label class="register-field">Mot de passe<input name="password" type="password" minlength="8" required></label>
    </div><button class="register-submit">Envoyer la demande</button></form>
  </main>
  <script src="register.js"></script>
</body>
</html>
