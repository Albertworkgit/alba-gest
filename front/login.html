<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | ALBA-STOCK</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:#f5f7f3}.login-card{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #e6ebe7;border-radius:12px;padding:32px;box-shadow:0 20px 50px #183b3514}.login-brand{display:flex;align-items:center;gap:10px;font:700 24px 'Space Grotesk',sans-serif;color:#1d2926;margin-bottom:28px}.login-mark{width:34px;height:34px;border-radius:9px;background:#f07f5f;color:#fff;display:grid;place-items:center}.login-card h1{font:600 24px 'Space Grotesk',sans-serif;margin:0}.login-card p{color:#73807b;font-size:13px;margin:8px 0 24px}.login-field{display:block;color:#73807b;font-size:12px;font-weight:700;margin:16px 0}.login-field input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #e6ebe7;border-radius:6px;font:inherit;color:#1d2926}.login-submit{width:100%;background:#147c70;color:#fff;padding:12px;border-radius:7px;font-weight:700;margin-top:8px}.login-error{display:none;background:#fde8e4;color:#bb5149;padding:10px;border-radius:6px;font-size:12px;margin-bottom:12px}.login-error.visible{display:block}.login-help{font-size:11px!important;text-align:center;margin:18px 0 0!important}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="login-brand"><span class="login-mark">A</span>ALBA-STOCK</div>
    <h1>Bienvenue</h1>
    <p>Connectez-vous à votre espace de gestion.</p>
    <div class="login-error" id="login-error" role="alert"></div>
    <form id="login-form">
      <label class="login-field">Email ou nom utilisateur<input name="login" autocomplete="username" required></label>
      <label class="login-field">Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="login-submit" type="submit">Se connecter</button>
    </form>
    <p class="login-help">Administrateurs, gérants, caissiers et magasiniers utilisent la même connexion.</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
